<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <title>Dominion Arena</title>
    <style>
        body { margin: 0; background: #0c101c; color: white; font-family: sans-serif; overflow: hidden; }
        #hud { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); p: 15px; border-radius: 8px; width: 220px; z-index: 10; }
        #hud h3 { margin: 0 0 10px 0; font-size: 14px; color: #ffd700; }
        .player-item { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px; }
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="hud">
        <h3>قائمة اللاعبين</h3>
        <div id="playerList">جاري التحميل...</div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId') || '';
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const socket = new WebSocket(`${protocol}//${window.location.host}${userId ? '?userId=' + userId : ''}`);

    let players = [];

    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'SYNC') {
            // تجميع كل اللاعبين في مصفوفة واحدة مباشرة
            const active = data.activePlayers ? Object.values(data.activePlayers) : [];
            const stands = data.standVault ? Object.values(data.standVault) : [];
            players = [...active, ...stands];
            
            updateHUD();
        }
    };

    function updateHUD() {
        const list = document.getElementById('playerList');
        if (players.length === 0) {
            list.innerHTML = 'لا يوجد لاعبون';
            return;
        }
        list.innerHTML = players.map(p => `
            <div class="player-item">
                <span><b>${p.name || 'لاعب'}</b></span>
                <span style="color: #00ffff;">${p.points || 0} PTS</span>
            </div>
        `).join('');
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // رسم خلفية الملعب البسيطة
        ctx.fillStyle = '#0e442b';
        ctx.fillRect(50, 50, canvas.width - 100, canvas.height - 100);

        // رسم كل لاعب ككرة بسيطة عليها الاسم والنقاط
        players.forEach(p => {
            const x = p.x || canvas.width / 2;
            const y = p.y || canvas.height / 2;

            // رسم الكرة
            ctx.beginPath();
            ctx.arc(x, y, 35, 0, Math.PI * 2);
            ctx.fillStyle = '#00f5ff';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.stroke();

            // كتابة الاسم
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(p.name || 'لاعب', x, y - 5);

            // كتابة النقاط
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText(`${p.points || 0} PTS`, x, y + 15);
        });

        requestAnimationFrame(render);
    }

    render();
</script>
</body>
</html>
