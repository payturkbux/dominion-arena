<!DOCTYPE html>
<html class="dark" lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dominion Arena Stadium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #060911; margin: 0; overflow: hidden; }
        .glass-hud { background: rgba(10, 14, 23, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.12); }
    </style>
</head>
<body class="text-white relative w-screen h-screen select-none">

    <!-- Top HUD Header -->
    <header class="absolute top-6 left-1/2 -translate-x-1/2 z-30 flex items-center gap-6 glass-hud px-8 py-3 rounded-2xl shadow-2xl border border-cyan-500/30">
        <div class="flex items-center gap-3">
            <span class="text-3xl">🏟️</span>
            <div>
                <div class="text-[10px] uppercase text-cyan-400 font-bold tracking-widest">استاد الهيمنة الملكي</div>
                <div class="text-xs font-bold text-emerald-400">حواجز الملعب مغلقة بالكامل والكرات مؤمنة بالمدرجات</div>
            </div>
        </div>
    </header>

    <!-- 🏆 Leaderboard Container -->
    <aside class="absolute top-6 right-6 z-30 glass-hud p-4 rounded-2xl w-72 border border-amber-500/30 shadow-2xl">
        <div class="flex items-center gap-2 mb-3 pb-2 border-b border-white/10">
            <span class="text-xl">🏆</span>
            <h3 class="font-bold text-sm text-amber-400">قائمة المتصدرين (Top 5)</h3>
        </div>
        <ul id="leaderboardList" class="space-y-2 text-xs">
            <!-- يتم تعبئتها ديناميكياً بواسطة JavaScript -->
        </ul>
    </aside>

    <canvas id="worldCanvas" class="w-full h-full block cursor-crosshair"></canvas>

<script>
    const canvas = document.getElementById('worldCanvas');
    const ctx = canvas.getContext('2d');

    let screenWidth, screenHeight;
    function resize() {
        screenWidth = canvas.width = window.innerWidth;
        screenHeight = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let camera = { x: 3600, y: 3700, zoom: 0.55 };
    let activePlayers = {};
    let standVault = {};
    let selfId = null;

    const monumentImages = {};
    const countryLandmarks = {
        "SY": { name: "سوريا", flag: "🇸🇾", standX: 1200, color: "#00f5ff", url: "https://images.unsplash.com/photo-1565557623262-b51c2513a641?auto=format&fit=crop&w=400&q=80" },
        "SA": { name: "السعودية", flag: "🇸🇦", standX: 2400, color: "#3bff17", url: "https://images.unsplash.com/photo-1586724237569-f3d0c1dee8c6?auto=format&fit=crop&w=400&q=80" },
        "TR": { name: "تركيا", flag: "🇹🇷", standX: 3600, color: "#ff4b89", url: "https://images.unsplash.com/photo-1541432901042-2d8bd64b4a9b?auto=format&fit=crop&w=400&q=80" },
        "EG": { name: "مصر", flag: "🇪🇬", standX: 4800, color: "#ffb1c3", url: "https://images.unsplash.com/photo-1503177119275-0aa32b3a9368?auto=format&fit=crop&w=400&q=80" },
        "AE": { name: "الإمارات", flag: "🇦🇪", standX: 6000, color: "#ffd9e0", url: "https://images.unsplash.com/photo-1512453979798-5ea266f8880c?auto=format&fit=crop&w=400&q=80" }
    };

    Object.keys(countryLandmarks).forEach(code => {
        const img = new Image();
        img.src = countryLandmarks[code].url;
        monumentImages[code] = img;
    });

    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}`;
    const socket = new WebSocket(wsUrl);

    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'INIT') {
            selfId = data.selfId;
        } else if (data.type === 'SYNC') {
            activePlayers = data.activePlayers;
            standVault = data.standVault;
            if (selfId && activePlayers[selfId]) {
                const me = activePlayers[selfId];
                camera.x += (me.x - camera.x) * 0.1;
                camera.y += (me.y - camera.y) * 0.1;
            }
            updateLeaderboard();
        }
    };

    window.addEventListener('mousemove', (e) => {
        if (!selfId || !activePlayers[selfId]) return;
        const worldX = (e.clientX - screenWidth / 2) / camera.zoom + camera.x;
        const worldY = (e.clientY - screenHeight / 2) / camera.zoom + camera.y;
        socket.send(JSON.stringify({ type: 'TARGET', x: worldX, y: worldY }));
    });

    // تحديث قائمة المتصدرين
    function updateLeaderboard() {
        const listEl = document.getElementById('leaderboardList');
        const allEntities = [...Object.values(activePlayers), ...Object.values(standVault)];
        
        // ترتيب التنازلي حسب النقاط
        allEntities.sort((a, b) => b.points - a.points);
        const top5 = allEntities.slice(0, 5);

        listEl.innerHTML = top5.map((item, index) => {
            const isMe = item.id === selfId;
            const statusTag = item.inStand ? '<span class="text-[9px] text-gray-400 bg-gray-800 px-1.5 py-0.5 rounded">مدرج</span>' : '<span class="text-[9px] text-emerald-400 bg-emerald-950 px-1.5 py-0.5 rounded">ملعب</span>';
            
            return `
                <li class="flex items-center justify-between p-2 rounded-lg ${isMe ? 'bg-amber-500/20 border border-amber-500/50' : 'bg-white/5'}">
                    <div class="flex items-center gap-2 truncate">
                        <span class="font-bold text-amber-400 w-4">${index + 1}.</span>
                        <span class="truncate">${item.country.flag} ${item.name}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        ${statusTag}
                        <span class="font-mono font-bold text-cyan-300">${item.points.toLocaleString()}</span>
                    </div>
                </li>
            `;
        }).join('');
    }

    function drawStadiumPitch() {
        ctx.fillStyle = "#090d16";
        ctx.fillRect(0, 0, 7200, 6000);

        let turfGrad = ctx.createLinearGradient(0, 1900, 0, 5500);
        turfGrad.addColorStop(0, "#092b1b");
        turfGrad.addColorStop(0.5, "#0d3b25");
        turfGrad.addColorStop(1, "#092b1b");
        ctx.fillStyle = turfGrad;
        ctx.fillRect(500, 1900, 6200, 3600);

        ctx.fillStyle = "rgba(255, 255, 255, 0.025)";
        for (let x = 500; x < 6700; x += 300) {
            ctx.fillRect(x, 1900, 150, 3600);
        }

        ctx.strokeStyle = "#00f5ff";
        ctx.lineWidth = 14;
        ctx.shadowBlur = 25;
        ctx.shadowColor = "#00f5ff";
        ctx.strokeRect(500, 1900, 6200, 3600);
        ctx.shadowBlur = 0;

        ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
        ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(3600, 1900); ctx.lineTo(3600, 5500); ctx.stroke();
        ctx.beginPath(); ctx.arc(3600, 3700, 450, 0, Math.PI * 2); ctx.stroke();
    }

    function drawStandsStructure() {
        Object.keys(countryLandmarks).forEach(code => {
            const c = countryLandmarks[code];
            
            let standGrad = ctx.createLinearGradient(c.standX - 450, 200, c.standX + 450, 1000);
            standGrad.addColorStop(0, "#131a29");
            standGrad.addColorStop(1, "#0a0e17");
            ctx.fillStyle = standGrad;
            
            ctx.beginPath();
            ctx.roundRect(c.standX - 450, 180, 900, 950, 24);
            ctx.fill();

            ctx.strokeStyle = c.color;
            ctx.lineWidth = 4;
            ctx.shadowBlur = 12;
            ctx.shadowColor = c.color;
            ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 32px 'Tajawal'";
            ctx.textAlign = "center";
            ctx.fillText(`${c.flag} مدرج VIP - ${c.name}`, c.standX, 260);
        });
    }

    function drawOrb(p, isStand) {
        ctx.save();
        ctx.translate(p.x, p.y);

        const countryCode = p.country?.code || "SY";
        const img = monumentImages[countryCode];
        const themeColor = countryLandmarks[countryCode]?.color || "#00f5ff";

        ctx.beginPath();
        ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
        ctx.clip();

        if (img && img.complete) {
            const scale = Math.max(1, p.radius / 30);
            const drawWidth = p.radius * 2 * scale;
            const drawHeight = p.radius * 2 * scale;
            ctx.globalAlpha = isStand ? 0.75 : 0.95;
            ctx.drawImage(img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
            ctx.globalAlpha = 1.0;
        }

        let glassGrad = ctx.createRadialGradient(-p.radius * 0.3, -p.radius * 0.3, 2, 0, 0, p.radius);
        glassGrad.addColorStop(0, "rgba(255, 255, 255, 0.45)");
        glassGrad.addColorStop(1, "rgba(0, 0, 0, 0.75)");
        ctx.fillStyle = glassGrad;
        ctx.beginPath(); ctx.arc(0, 0, p.radius, 0, Math.PI * 2); ctx.fill();

        ctx.lineWidth = Math.max(3, p.radius * 0.08);
        ctx.strokeStyle = isStand ? "rgba(255, 255, 255, 0.4)" : (p.id === selfId ? "#ffd700" : themeColor);
        ctx.shadowBlur = isStand ? 5 : (p.id === selfId ? 30 : 20);
        ctx.shadowColor = ctx.strokeStyle;
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const fontSize = Math.max(12, p.radius * 0.23);
        ctx.font = `bold ${fontSize}px 'Tajawal'`;
        ctx.fillText(`${p.country.flag} ${p.name}`, 0, -fontSize * 0.4);

        ctx.font = `bold ${fontSize * 0.75}px 'Sora'`;
        ctx.fillStyle = isStand ? "#cbd5e0" : "#00ffff";
        ctx.fillText(`${p.points.toLocaleString()} PTS`, 0, fontSize * 0.65);

        ctx.restore();
    }

    function render() {
        ctx.clearRect(0, 0, screenWidth, screenHeight);
        ctx.save();
        ctx.translate(screenWidth / 2, screenHeight / 2);
        ctx.scale(camera.zoom, camera.zoom);
        ctx.translate(-camera.x, -camera.y);

        drawStadiumPitch();
        drawStandsStructure();

        Object.values(standVault).forEach(p => drawOrb(p, true));
        Object.values(activePlayers).forEach(p => drawOrb(p, false));

        ctx.restore();
        requestAnimationFrame(render);
    }

    render();
</script>
</body>
</html>
