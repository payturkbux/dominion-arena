<!DOCTYPE html>
<html class="dark" lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Dominion Arena Stadium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0c101c; margin: 0; overflow: hidden; touch-action: none; }
        .glass-hud { background: rgba(10, 14, 23, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.12); }
        @keyframes slideIn {
            from { transform: translateY(-100%) translateX(-50%); opacity: 0; }
            to { transform: translateY(0) translateX(-50%); opacity: 1; }
        }
        .toast-animate { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="text-white relative w-screen h-screen select-none">

    <div id="toastContainer" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <header class="absolute top-6 left-1/2 -translate-x-1/2 z-30 flex items-center gap-6 glass-hud px-8 py-3 rounded-2xl shadow-2xl border border-cyan-500/30">
        <div class="flex items-center gap-3">
            <span class="text-3xl">⚔️</span>
            <div>
                <div id="hudStatusTitle" class="text-[10px] uppercase text-cyan-400 font-bold tracking-widest">كاميرا تكتيكية ديناميكية</div>
                <div id="hudActionTip" class="text-xs font-bold text-emerald-400">حرّك الماوس أو انقر لتوجيه الكرة بالميدان</div>
            </div>
        </div>
    </header>

    <div class="absolute top-6 left-6 z-30 flex gap-2">
        <button id="authBtn" onclick="openLoginModal()" class="glass-hud px-4 py-2.5 rounded-2xl flex items-center gap-2 border border-cyan-500/40 text-xs font-bold text-cyan-300 hover:bg-cyan-500/20 active:scale-95 transition shadow-2xl">
            <span id="authBtnIcon">🔑</span>
            <span id="authBtnText">تسجيل الدخول</span>
        </button>
        <button id="logoutBtn" onclick="submitLogout()" class="hidden glass-hud px-3 py-2.5 rounded-2xl flex items-center gap-1 border border-red-500/40 text-xs font-bold text-red-400 hover:bg-red-500/20 active:scale-95 transition shadow-2xl">
            <span>🚪</span>
            <span>خروج</span>
        </button>
    </div>

    <div id="loginModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-md p-4">
        <div class="glass-hud p-6 rounded-3xl w-full max-w-sm border border-cyan-500/40 text-center shadow-2xl space-y-4">
            <div class="text-4xl">⚽</div>
            <h3 class="text-lg font-bold text-cyan-400">تسجيل الدخول إلى الميدان</h3>
            <p class="text-xs text-gray-300 leading-relaxed">أدخل بريدك الإلكتروني وكلمة السر المعتمدة:</p>
            
            <div class="space-y-3">
                <input type="email" id="userEmailInput" placeholder="البريد الإلكتروني" class="w-full px-4 py-3 bg-gray-900/90 border border-cyan-500/30 rounded-xl text-white text-xs text-right font-mono focus:outline-none focus:border-cyan-400 transition">
                <input type="password" id="userPasswordInput" placeholder="كلمة السر" class="w-full px-4 py-3 bg-gray-900/90 border border-cyan-500/30 rounded-xl text-white text-xs text-right font-mono focus:outline-none focus:border-cyan-400 transition">
            </div>

            <div id="loginError" class="hidden text-xs text-red-400 font-bold bg-red-950/50 p-2 rounded-lg border border-red-500/30"></div>
            
            <div class="flex gap-2">
                <button id="submitLoginBtn" onclick="submitLogin()" class="flex-1 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white py-2.5 rounded-xl text-xs font-bold transition shadow-lg active:scale-95 flex items-center justify-center gap-2">
                    <span id="loginBtnSpinner" class="hidden w-3 h-3 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                    <span id="loginBtnText">دخول</span>
                </button>
                <button onclick="closeLoginModal()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 py-2.5 rounded-xl text-xs font-bold transition active:scale-95">إلغاء</button>
            </div>
        </div>
    </div>

    <aside class="absolute top-6 right-6 z-30 glass-hud p-4 rounded-2xl w-80 border border-amber-500/30 shadow-2xl">
        <div class="flex items-center gap-2 mb-3 pb-2 border-b border-white/10">
            <span class="text-xl">🏆</span>
            <h3 class="font-bold text-sm text-amber-400">قائمة المتصدرين (Top 5)</h3>
        </div>
        <ul id="leaderboardList" class="space-y-2 text-xs"></ul>
    </aside>

    <canvas id="worldCanvas" class="w-full h-full block cursor-crosshair"></canvas>

<script>
    const SUPABASE_URL = "https://bwbgfdteocewitdzrysg.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3YmdmZHRlb2Nld2l0ZHpyeXNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NTE2MTMsImV4cCI6MjEwMzQyNzYxM30.C7hId5uF-p_7ibGSs0P7a2yxpOD-Zu4ON-lu7Pivn6k";

    let supabaseClient = null;
    try {
        if (typeof supabase !== 'undefined' && SUPABASE_URL && SUPABASE_ANON_KEY) {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
    } catch (e) {
        console.error("Supabase Init Error:", e);
    }

    function showNotification(message, type = 'error') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        const bgColor = type === 'error' ? 'bg-red-900/90 border-red-500/50 text-red-200' : 'bg-emerald-900/90 border-emerald-500/50 text-emerald-200';
        const icon = type === 'error' ? '⚠️' : '✅';

        toast.className = `toast-animate glass-hud px-4 py-2.5 rounded-xl border text-xs font-bold shadow-2xl flex items-center gap-2 ${bgColor} pointer-events-auto`;
        toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
        
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.5s ease';
            setTimeout(() => toast.remove(), 500);
        }, 4000);
    }

    const canvas = document.getElementById('worldCanvas');
    const ctx = canvas.getContext('2d');

    let screenWidth, screenHeight;
    function resize() {
        screenWidth = canvas.width = window.innerWidth;
        screenHeight = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const PITCH_BOUNDS = { minX: 500, maxX: 6700, minY: 1900, maxY: 5500 };

    let camera = { x: 3600, y: 3000, zoom: 0.38, targetZoom: 0.38 };
    const MIN_ZOOM = 0.20;
    const MAX_ZOOM = 1.20;

    let activePlayers = {};
    let standVault = {};
    let dynamicStands = {};
    let selfId = null;
    let socket = null;
    let currentUserProfile = null; // تخزين بيانات المستخدم المسجل محلياً

    let staticUsers = [];

    async function loadRealUsersFromDB() {
        if (!supabaseClient) return;

        try {
            const { data, error } = await supabaseClient
                .from('profiles') 
                .select('*');

            if (!error && data) {
                staticUsers = data.map((u, index) => ({
                    id: u.id || `db_${index}`,
                    name: u.full_name || u.username || u.name || "لاعب",
                    points: Number(u.balance ?? u.points ?? u.score ?? 0), // ضمان تحويل القيم الأرقام
                    country: { 
                        code: u.country_code || "SY", 
                        flag: u.flag || "🇸🇾" 
                    },
                    tier: u.tier || ((u.balance || 0) > 10000 ? "Gold" : (u.balance || 0) > 5000 ? "Silver" : "Bronze"),
                    radius: 40,
                    x: 1200 + (index % 12) * 420,
                    y: 2200 + Math.floor(index / 12) * 320
                }));
                updateLeaderboard();
            }
        } catch (err) {
            console.error("DB Load Error:", err);
        }
    }

    const monumentImages = {};
    const countryLandmarks = {
        "SY": { name: "سوريا", flag: "🇸🇾", standX: 1200, color: "#00f5ff", url: "https://images.unsplash.com/photo-1565557623262-b51c2513a641?auto=format&fit=crop&w=400&q=80" },
        "SA": { name: "السعودية", flag: "🇸🇦", standX: 2400, color: "#3bff17", url: "https://images.unsplash.com/photo-1586724237569-f3d0c1dee8c6?auto=format&fit=crop&w=400&q=80" },
        "TR": { name: "تركيا", flag: "🇹🇷", standX: 3600, color: "#ff4b89", url: "https://images.unsplash.com/photo-1541432901042-2d8bd64b4a9b?auto=format&fit=crop&w=400&q=80" },
        "EG": { name: "مصر", flag: "🇪🇬", standX: 4800, color: "#ffb1c3", url: "https://images.unsplash.com/photo-1503177119275-0aa32b3a9368?auto=format&fit=crop&w=400&q=80" },
        "AE": { name: "الإمارات", flag: "🇦🇪", standX: 6000, color: "#ffd9e0", url: "https://images.unsplash.com/photo-1512453979798-5ea266f8880c?auto=format&fit=crop&w=400&q=80" }
    };

    Object.keys(countryLandmarks).forEach(code => {
        const img = new Image();
        img.src = countryLandmarks[code].url;
        monumentImages[code] = img;
    });

    let currentUserId = localStorage.getItem('dominion_user_id') || '';

    function updateAuthUI() {
        const authBtnText = document.getElementById('authBtnText');
        const authBtnIcon = document.getElementById('authBtnIcon');
        const logoutBtn = document.getElementById('logoutBtn');
        
        if (currentUserId && !currentUserId.startsWith('guest_')) {
            if (authBtnText) authBtnText.innerText = currentUserProfile?.full_name || 'حسابي المسجل';
            if (authBtnIcon) authBtnIcon.innerText = '👤';
            if (logoutBtn) logoutBtn.classList.remove('hidden');
        } else {
            if (authBtnText) authBtnText.innerText = 'تسجيل الدخول';
            if (authBtnIcon) authBtnIcon.innerText = '🔑';
            if (logoutBtn) logoutBtn.classList.add('hidden');
        }
    }

    function initWebSocket(userId) {
        if (socket) socket.close();

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsHost = window.location.host || 'dominion-arena-o372.onrender.com';
        const wsUrl = `${protocol}//${wsHost}${userId ? '?userId=' + encodeURIComponent(userId) : ''}`;
        
        try {
            socket = new WebSocket(wsUrl);

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'INIT') {
                    selfId = data.selfId;
                } else if (data.type === 'SYNC') {
                    activePlayers = data.activePlayers || {};
                    standVault = data.standVault || {};
                    dynamicStands = data.dynamicStands || {};
                    
                    // دمج بيانات المجلد الشخصي المسجل مع الكرة الخاصة بنا في حال كان السيرفر يقدم بيانات افتراضية
                    const myKey = selfId || userId;
                    const myOrb = activePlayers[myKey] || standVault[myKey] || activePlayers[selfId] || standVault[selfId];
                    
                    if (myOrb && currentUserProfile) {
                        myOrb.name = currentUserProfile.full_name || currentUserProfile.username || myOrb.name;
                        myOrb.points = currentUserProfile.balance ?? myOrb.points;
                    }

                    if (myOrb) {
                        camera.x += (myOrb.x - camera.x) * 0.1;
                        camera.y += (myOrb.y - camera.y) * 0.1;
                    }
                    updateLeaderboard();
                }
            };

            socket.onerror = () => {
                showNotification("جاري تشغيل محاكاة الحركة المحلية المباشرة", "error");
            };
        } catch (e) {
            console.error("WS Connect error:", e);
        }
    }

    // جلب ملف المستخدم بعد تسجيل الدخول لرؤية الرصيد
    async function fetchUserProfile(uid) {
        if (!supabaseClient || !uid) return;
        const { data, error } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', uid)
            .single();

        if (!error && data) {
            currentUserProfile = data;
            updateAuthUI();
        }
    }

    function openLoginModal() {
        document.getElementById('loginModal').classList.remove('hidden');
        document.getElementById('userEmailInput').focus();
    }

    function closeLoginModal() {
        document.getElementById('loginModal').classList.add('hidden');
        document.getElementById('loginError').classList.add('hidden');
    }

    async function submitLogin() {
        const emailInput = document.getElementById('userEmailInput');
        const passwordInput = document.getElementById('userPasswordInput');
        const errorEl = document.getElementById('loginError');
        const spinner = document.getElementById('loginBtnSpinner');
        const btnText = document.getElementById('loginBtnText');

        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        errorEl.classList.add('hidden');

        if (!email || !password) {
            const msg = "يرجى كتابة البريد الإلكتروني وكلمة السر";
            errorEl.innerText = msg;
            errorEl.classList.remove('hidden');
            return;
        }

        if (!supabaseClient) {
            const msg = "تعذر الاتصال بقاعدة البيانات";
            errorEl.innerText = msg;
            errorEl.classList.remove('hidden');
            return;
        }

        spinner.classList.remove('hidden');
        btnText.innerText = "جاري التحقق...";

        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                errorEl.innerText = "البيانات المدخلة غير صحيحة";
                errorEl.classList.remove('hidden');
                showNotification("فشل تسجيل الدخول", "error");
            } else if (data && data.user) {
                currentUserId = data.user.id;
                localStorage.setItem('dominion_user_id', currentUserId);
                
                await fetchUserProfile(currentUserId);
                showNotification("تم تسجيل الدخول ورصد الرصيد بنجاح!", "success");
                
                closeLoginModal();
                initWebSocket(currentUserId);
            }
        } catch (err) {
            errorEl.innerText = "حدث خطأ غير متوقع أثناء الدخول";
            errorEl.classList.remove('hidden');
        } finally {
            spinner.classList.add('hidden');
            btnText.innerText = "دخول";
        }
    }

    async function submitLogout() {
        if (supabaseClient) await supabaseClient.auth.signOut();
        localStorage.removeItem('dominion_user_id');
        currentUserId = '';
        currentUserProfile = null;
        showNotification("تم خروج الحساب", "success");
        updateAuthUI();
        initWebSocket('');
    }

    window.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
        camera.targetZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, camera.targetZoom * zoomFactor));
    }, { passive: false });

    // تصحيح حسابات تحويل الماوس لإتاحة التحكم الدقيق
    function getWorldCoordinates(clientX, clientY) {
        const worldX = (clientX - screenWidth / 2) / camera.zoom + camera.x;
        const worldY = (clientY - screenHeight / 2) / camera.zoom + camera.y;
        return { x: worldX, y: worldY };
    }

    function clampToPitch(x, y, radius = 40) {
        const clampedX = Math.max(PITCH_BOUNDS.minX + radius, Math.min(PITCH_BOUNDS.maxX - radius, x));
        const clampedY = Math.max(PITCH_BOUNDS.minY + radius, Math.min(PITCH_BOUNDS.maxY - radius, y));
        return { x: clampedX, y: clampedY };
    }

    // الدالة المسؤولة عن توجيه الحركة وتفاعل الماوس
    function sendTargetPosition(clientX, clientY) {
        const targetPos = getWorldCoordinates(clientX, clientY);
        const boundedPos = clampToPitch(targetPos.x, targetPos.y, 40);

        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({
                type: 'TARGET',
                x: boundedPos.x,
                y: boundedPos.y
            }));
        } else {
            // محاكاة سريعة محلية عند عدم ربط WebSocket لضمان الاستجابة مع الماوس
            const myKey = selfId || currentUserId;
            let targetOrb = activePlayers[myKey] || standVault[myKey];
            if (!targetOrb) {
                targetOrb = { id: myKey, x: 3600, y: 3700, radius: 40, points: currentUserProfile?.balance || 0, name: currentUserProfile?.full_name || 'أنا' };
                activePlayers[myKey] = targetOrb;
            }
            targetOrb.x += (boundedPos.x - targetOrb.x) * 0.15;
            targetOrb.y += (boundedPos.y - targetOrb.y) * 0.15;
        }
    }

    window.addEventListener('mousemove', (e) => {
        if (e.target.closest('header, aside, button, #loginModal, #toastContainer')) return;
        sendTargetPosition(e.clientX, e.clientY);
    });

    window.addEventListener('touchmove', (e) => {
        if (e.touches && e.touches.length > 0) {
            if (e.touches[0].target.closest('header, aside, button, #loginModal, #toastContainer')) return;
            sendTargetPosition(e.touches[0].clientX, e.touches[0].clientY);
        }
    }, { passive: true });

    function updateLeaderboard() {
        const listEl = document.getElementById('leaderboardList');
        if (!listEl) return;
        
        let allEntities = [...Object.values(activePlayers), ...Object.values(standVault), ...staticUsers];
        
        // إعادة الفرز وحذف التكرار
        const map = new Map();
        allEntities.forEach(item => map.set(item.id || item.name, item));
        allEntities = Array.from(map.values());

        allEntities.sort((a, b) => (Number(b.points) || 0) - (Number(a.points) || 0));
        const top5 = allEntities.slice(0, 5);

        listEl.innerHTML = top5.map((item, index) => {
            const isMe = item.id === selfId || item.id === currentUserId;
            const flag = (item.country && item.country.flag) ? item.country.flag : '🚩';
            const name = item.name || 'لاعب';
            const points = item.points !== undefined && item.points !== null ? Number(item.points).toLocaleString() : '0';
            const tier = item.tier || 'Bronze';

            return `
                <li class="flex items-center justify-between p-2 rounded-lg ${isMe ? 'bg-amber-500/20 border border-amber-500/50' : 'bg-white/5'}">
                    <div class="flex items-center gap-2 truncate">
                        <span class="font-bold text-amber-400 w-4">${index + 1}.</span>
                        <span class="truncate font-bold">${flag} ${name}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-mono font-bold text-cyan-300">${points} $</span>
                    </div>
                </li>
            `;
        }).join('');
    }

    function drawStadiumPitch() {
        ctx.fillStyle = "#0c1220";
        ctx.fillRect(-3000, -3000, 13000, 12000);

        let lightGrad = ctx.createRadialGradient(3600, 3000, 500, 3600, 3000, 5500);
        lightGrad.addColorStop(0, "rgba(0, 245, 255, 0.1)");
        lightGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = lightGrad;
        ctx.fillRect(-3000, -3000, 13000, 12000);

        let turfGrad = ctx.createLinearGradient(0, 1900, 0, 5500);
        turfGrad.addColorStop(0, "#0a3320");
        turfGrad.addColorStop(0.5, "#0e442b");
        turfGrad.addColorStop(1, "#0a3320");
        ctx.fillStyle = turfGrad;
        ctx.fillRect(500, 1900, 6200, 3600);

        ctx.fillStyle = "rgba(255, 255, 255, 0.03)";
        for (let x = 500; x < 6700; x += 300) {
            ctx.fillRect(x, 1900, 150, 3600);
        }

        ctx.strokeStyle = "#00f5ff";
        ctx.lineWidth = 14;
        ctx.shadowBlur = 30;
        ctx.shadowColor = "#00f5ff";
        ctx.strokeRect(500, 1900, 6200, 3600);
        ctx.shadowBlur = 0;

        ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
        ctx.lineWidth = 10;
        ctx.beginPath(); ctx.moveTo(3600, 1900); ctx.lineTo(3600, 5500); ctx.stroke();
        ctx.beginPath(); ctx.arc(3600, 3700, 450, 0, Math.PI * 2); ctx.stroke();
    }

    function drawStandsStructure() {
        Object.keys(countryLandmarks).forEach(code => {
            const c = countryLandmarks[code];
            let standGrad = ctx.createLinearGradient(c.standX - 450, 700, c.standX + 450, 1600);
            standGrad.addColorStop(0, "#192234");
            standGrad.addColorStop(1, "#0f1624");
            ctx.fillStyle = standGrad;
            
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(c.standX - 450, 750, 900, 850, 24);
            } else {
                ctx.rect(c.standX - 450, 750, 900, 850);
            }
            ctx.fill();

            ctx.strokeStyle = c.color;
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 34px 'Tajawal'";
            ctx.textAlign = "center";
            ctx.fillText(`${c.flag} مدرج - ${c.name}`, c.standX, 810);
        });
    }

    function drawOrb(p, isStand) {
        if (!p || typeof p.x !== 'number' || typeof p.y !== 'number') return;
        
        ctx.save();
        ctx.translate(p.x, p.y);

        const radius = p.radius || 40;
        const countryCode = (p.country && p.country.code) ? p.country.code : "SY";
        const img = monumentImages[countryCode];
        const themeColor = countryLandmarks[countryCode]?.color || "#00f5ff";

        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.clip();

        if (img && img.complete && img.naturalWidth !== 0) {
            ctx.drawImage(img, -radius, -radius, radius * 2, radius * 2);
        }

        let glassGrad = ctx.createRadialGradient(-radius * 0.3, -radius * 0.3, 2, 0, 0, radius);
        glassGrad.addColorStop(0, "rgba(255, 255, 255, 0.3)");
        glassGrad.addColorStop(1, "rgba(0, 0, 0, 0.7)");
        ctx.fillStyle = glassGrad;
        ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();

        ctx.lineWidth = 4;
        ctx.strokeStyle = (p.id === selfId || p.id === currentUserId) ? "#ffd700" : themeColor;
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const fontSize = 12;
        ctx.font = `bold ${fontSize}px 'Tajawal'`;
        
        const flag = (p.country && p.country.flag) ? p.country.flag : '';
        const name = p.name || 'لاعب';
        
        // عرض الرصيد بشكل مباشر على الكرة
        const displayBalance = p.points !== undefined && p.points !== null ? Number(p.points).toLocaleString() : '0';

        ctx.fillText(`${flag} ${name}`, 0, -fontSize * 0.7);
        ctx.font = `bold ${fontSize * 0.85}px 'Sora'`;
        ctx.fillStyle = "#00ffff";
        ctx.fillText(`${displayBalance} $`, 0, fontSize * 0.7);

        ctx.restore();
    }

    function render() {
        camera.zoom += (camera.targetZoom - camera.zoom) * 0.1;

        ctx.clearRect(0, 0, screenWidth, screenHeight);
        ctx.save();
        ctx.translate(screenWidth / 2, screenHeight / 2);
        ctx.scale(camera.zoom, camera.zoom);
        ctx.translate(-camera.x, -camera.y);

        drawStadiumPitch();
        drawStandsStructure();

        staticUsers.forEach(p => drawOrb(p, false));
        Object.values(standVault).forEach(p => drawOrb(p, true));
        Object.values(activePlayers).forEach(p => drawOrb(p, false));

        ctx.restore();
        requestAnimationFrame(render);
    }

    // بدء التشغيل والجلب التلقائي للبيانات
    if (currentUserId) fetchUserProfile(currentUserId);
    updateAuthUI();
    initWebSocket(currentUserId);
    loadRealUsersFromDB();
    render();
</script>
</body>
</html>
