<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taralali Stadium - Arena</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0b0e14; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas { width: 100vw; height: 100vh; display: block; cursor: crosshair; touch-action: none; }
        
        #hud {
            position: absolute; top: 20px; right: 20px;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 14px 22px; border-radius: 16px; color: #fff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            pointer-events: none; z-index: 10;
        }
        #hud h3 { font-size: 16px; color: #38bdf8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        #hud div { font-size: 14px; margin: 3px 0; color: #cbd5e1; }
        #hud strong { color: #f59e0b; font-weight: 700; }

        #action-tip {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75); border: 1px solid rgba(56, 189, 248, 0.4);
            color: #e2e8f0; padding: 12px 28px; border-radius: 30px;
            font-size: 15px; text-align: center; pointer-events: none;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.2); z-index: 10;
            animation: pulseTip 2s infinite ease-in-out;
        }

        @keyframes pulseTip {
            0%, 100% { opacity: 0.85; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.03); }
        }
    </style>
</head>
<body>

    <div id="hud">
        <h3 id="player-name">Taralali Player</h3>
        <div>النقاط / الرصيد: <strong id="player-points">0</strong></div>
        <div>الحالة: <span id="player-status" style="color: #f87171;">في المدرج</span></div>
    </div>

    <div id="action-tip">انقر بالماوس أو انقر على الشاشة للنزول إلى الميدان / التوجيه ⚔️</div>

    <canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // الاتصال بالخادم عبر WebSocket مع إرسال معرف البلد والصورة والاسم
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId') || 'usr_' + Math.floor(Math.random() * 89999 + 10000);
    const country = urlParams.get('country') || 'SY';
    const countryName = urlParams.get('countryName') || 'سوريا';
    const flag = urlParams.get('flag') || '🇸🇾';
    const countryImage = urlParams.get('countryImage') || '';
    const name = urlParams.get('name') || 'لاعب_' + userId.slice(-4);
    const points = urlParams.get('points') || 25000;

    const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    const wsUrl = `${wsProtocol}${window.location.host}?userId=${userId}&country=${country}&countryName=${encodeURIComponent(countryName)}&flag=${encodeURIComponent(flag)}&countryImage=${encodeURIComponent(countryImage)}&name=${encodeURIComponent(name)}&points=${points}`;
    
    const ws = new WebSocket(wsUrl);

    let selfId = null;
    let activePlayers = {};
    let standVault = {};
    let dynamicStands = {};
    let imageCache = {};

    // تحميل ومعالجة صور البلدان الممثلة
    function getCountryImage(url) {
        if (!url) return null;
        if (!imageCache[url]) {
            const img = new Image();
            img.src = url;
            imageCache[url] = img;
        }
        return imageCache[url];
    }

    // كاميرا العرض المستهدفة
    let camX = 4000, camY = 4000, camZoom = 0.5;

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'INIT') {
            selfId = data.selfId;
        } else if (data.type === 'SYNC') {
            activePlayers = data.activePlayers;
            standVault = data.standVault;
            dynamicStands = data.dynamicStands;
            updateHUD();
        }
    };

    function updateHUD() {
        if (!selfId) return;
        const myOrb = activePlayers[selfId] || standVault[selfId];
        if (myOrb) {
            document.getElementById('player-name').innerText = `${myOrb.country.flag} ${myOrb.name}`;
            document.getElementById('player-points').innerText = Math.floor(myOrb.points).toLocaleString();
            
            const statusElem = document.getElementById('player-status');
            if (myOrb.inStand) {
                statusElem.innerText = `في مدرج ${myOrb.country.name}`;
                statusElem.style.color = '#f87171';
                document.getElementById('action-tip').innerText = '💡 انقر بالماوس أو على الشاشة للنزول إلى الميدان ⚔️';
            } else {
                statusElem.innerText = 'في الميدان (مباشر)';
                statusElem.style.color = '#4ade80';
                document.getElementById('action-tip').innerText = '🎯 انقر على أي نقطة في الميدان لتوجيه كرتك إليها';
            }
        }
    }

    /**
     * 🎯 معالجة النقر بزر الماوس أو التاتش (Touch) للنزول إلى الميدان أو التوجيه
     */
    function handlePointerAction(clientX, clientY) {
        if (!selfId) return;

        const myOrb = activePlayers[selfId] || standVault[selfId];
        if (!myOrb) return;

        // تحويل إحداثيات الشاشة إلى إحداثيات العالم الملعب العالمي
        const worldX = (clientX - canvas.width / 2) / camZoom + camX;
        const worldY = (clientY - canvas.height / 2) / camZoom + camY;

        if (myOrb.inStand) {
            // ⚔️ إذا كان في المدرج -> النقر ينزله فوراً إلى الساحة
            ws.send(JSON.stringify({
                type: 'ENTER_ARENA',
                targetX: worldX,
                targetY: worldY
            }));
        } else {
            // 🎯 إذا كان بالساحة -> النقر يوجّه الكرة إلى النقطة المنقورة
            ws.send(JSON.stringify({
                type: 'TARGET',
                x: worldX,
                y: worldY
            }));
        }
    }

    // استجابة للنقر بالماوس
    window.addEventListener('mousedown', (e) => {
        handlePointerAction(e.clientX, e.clientY);
    });

    // استجابة للتاتش على الهواتف والأجهزة اللوحية
    window.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches.length > 0) {
            handlePointerAction(e.touches[0].clientX, e.touches[0].clientY);
        }
    }, { passive: true });

    // ==========================================
    // دالة الرسم الرئيسية (Render Loop)
    // ==========================================
    function render() {
        requestAnimationFrame(render);

        // تتبع كرة المستخدم بالكاميرا
        const myOrb = activePlayers[selfId] || standVault[selfId];
        if (myOrb) {
            camX += (myOrb.x - camX) * 0.1;
            camY += (myOrb.y - camY) * 0.1;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.scale(camZoom, camZoom);
        ctx.translate(-camX, -camY);

        // 1. رسم خلفية المحيط والاستاد
        ctx.fillStyle = '#070a0f';
        ctx.fillRect(-2000, -2000, 12000, 12000);

        // 2. رسم الميدان العشبي
        ctx.fillStyle = '#1e3a29';
        ctx.fillRect(1800, 1800, 4400, 4400);
        ctx.strokeStyle = '#2d5a3f';
        ctx.lineWidth = 12;
        ctx.strokeRect(1800, 1800, 4400, 4400);

        // خطوط الملعب الدائرية والمنتصف
        ctx.beginPath();
        ctx.arc(4000, 4000, 600, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 6;
        ctx.stroke();

        // 3. رسم مدرجات الدول المحيطة بالملعب مع صور وأعلام البلدان
        Object.values(dynamicStands).forEach(stand => {
            ctx.save();
            ctx.translate(stand.x, stand.y);

            // أرضية المدرج NION
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.strokeStyle = stand.color || '#38bdf8';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.roundRect(-400, -200, 800, 400, 24);
            ctx.fill();
            ctx.stroke();

            // رسم علم وصورة الدولة الممثلة للبلد
            const img = getCountryImage(stand.countryImage);
            if (img && img.complete) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(-280, 0, 45, 0, Math.PI * 2);
                ctx.clip();
                ctx.drawImage(img, -325, -45, 90, 90);
                ctx.restore();
            }

            // اسم الدولة والعلم
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`${stand.flag} ${stand.name}`, 0, -110);

            ctx.restore();
        });

        // 4. رسم كرات مدرجات الانتظار
        Object.values(standVault).forEach(orb => drawOrb(orb, true));

        // 5. رسم كرات اللاعبين النشطين في الميدان
        Object.values(activePlayers).forEach(orb => drawOrb(orb, false));

        ctx.restore();
    }

    function drawOrb(orb, isInStand) {
        ctx.save();
        ctx.translate(orb.x, orb.y);

        // هالة توهج للكرة الخاصة بالحساب الحالي
        if (orb.id === selfId) {
            ctx.beginPath();
            ctx.arc(0, 0, orb.radius + 14, 0, Math.PI * 2);
            ctx.fillStyle = isInStand ? 'rgba(248, 113, 113, 0.3)' : 'rgba(56, 189, 248, 0.4)';
            ctx.fill();
        }

        // الجسم الرئيسي للكرة
        ctx.beginPath();
        ctx.arc(0, 0, orb.radius, 0, Math.PI * 2);
        ctx.fillStyle = orb.country.color || '#38bdf8';
        ctx.globalAlpha = isInStand ? 0.75 : 1.0;
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        // اسم وتفاصيل المستخدم داخل/فوق الكرة
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${Math.max(14, orb.radius * 0.35)}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(orb.name, 0, -6);

        ctx.font = `${Math.max(11, orb.radius * 0.25)}px Arial`;
        ctx.fillStyle = '#f59e0b';
        ctx.fillText(`${Math.floor(orb.points)} pts`, 0, orb.radius * 0.35);

        ctx.restore();
    }

    render();
</script>
</body>
</html>
