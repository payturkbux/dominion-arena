<!DOCTYPE html>
<html class="dark" lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <!-- 📱 السماح بالزوم والتكبير بمرونة على شاشات الهواتف -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.1, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"/>
    <title>Dominion Arena Stadium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet"/>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            font-family: 'Tajawal', sans-serif;
            background-color: #0c101c;
        }
        .glass-hud {
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        
        /* ⚡ تأثير الومضة للرسالة */
        @keyframes flashPop {
            0% { transform: translate(-50%, -20px) scale(0.8); opacity: 0; }
            15% { transform: translate(-50%, 0) scale(1.05); opacity: 1; }
            25% { transform: translate(-50%, 0) scale(1); opacity: 1; }
            80% { transform: translate(-50%, 0) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -10px) scale(0.9); opacity: 0; }
        }
        .flash-toast {
            animation: flashPop 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .sidebar-transition {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }
    </style>
</head>
<body class="text-white relative w-screen h-screen select-none overflow-hidden">

    <!-- 🚩 نافذة اختيار الدولة -->
    <div id="countrySelectModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4">
        <div class="glass-hud p-6 sm:p-8 rounded-3xl w-full max-w-md border border-cyan-500/50 text-center shadow-2xl space-y-5">
            <div class="text-5xl">🚩</div>
            <h2 class="text-2xl font-black text-cyan-400">اختر دولتك للبدء</h2>
            <p class="text-xs text-gray-300 leading-relaxed">اختر علم الدولة التي تريد تمثيلها والمنافسة باسمها في الساحة الكبرى:</p>

            <select id="countrySelectDropdown" class="w-full px-4 py-3.5 bg-gray-900 border border-cyan-500/40 rounded-2xl text-white text-sm font-bold focus:outline-none focus:border-cyan-400 transition cursor-pointer">
                <option value="SY">🇸🇾 سوريا (SY)</option>
                <option value="SA">🇸🇦 السعودية (SA)</option>
                <option value="TR">🇹🇷 تركيا (TR)</option>
                <option value="EG">🇪🇬 مصر (EG)</option>
                <option value="AE">🇦🇪 الإمارات (AE)</option>
            </select>

            <button onclick="confirmCountryAndStart()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold py-3.5 rounded-2xl text-sm shadow-xl active:scale-95 transition">
                🚀 دخول الساحة الآن
            </button>
        </div>
    </div>

    <!-- ⚡ حاوية رسائل الومضة الموحدة -->
    <div id="toastContainer" class="fixed top-20 left-1/2 z-50 pointer-events-none flex flex-col items-center gap-2 w-full max-w-md px-4"></div>

    <div id="respawnOverlay" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
        <div class="glass-hud p-8 rounded-3xl w-full max-w-md border border-red-500/50 text-center shadow-2xl space-y-5">
            <div class="text-6xl">💥</div>
            <h2 class="text-2xl font-black text-red-400">تم ابتلاع كرتك!</h2>
            <p id="respawnText" class="text-sm text-gray-300 leading-relaxed">لقد خسرت نقاطك وتم إرجاعك للميدان.</p>
            <button onclick="requestReentry()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold py-3.5 rounded-2xl text-sm shadow-xl active:scale-95 transition">
                ⚡ إعادة النزول للميدان الآن
            </button>
        </div>
    </div>

    <header class="absolute top-4 left-1/2 -translate-x-1/2 z-30 flex items-center gap-3 glass-hud px-4 py-2 rounded-2xl shadow-2xl border border-cyan-500/30 max-w-[90vw]">
        <span class="text-xl">🏆</span>
        <div class="truncate">
            <div id="hudStatusTitle" class="text-[9px] sm:text-[10px] uppercase text-cyan-400 font-bold tracking-widest truncate">الساحة الكبرى - نظام تحفيز الضعفاء</div>
            <div id="hudActionTip" class="text-[11px] font-bold text-emerald-400 truncate">خزان التحفيز: <span id="incentivePoolVal" class="text-amber-400 font-mono">0</span> / 10</div>
        </div>
    </header>

    <div class="absolute top-4 left-4 z-30 flex gap-2">
        <button id="authBtn" onclick="openLoginModal()" class="glass-hud px-3 py-2 rounded-xl flex items-center gap-1.5 border border-cyan-500/40 text-xs font-bold text-cyan-300 hover:bg-cyan-500/20 active:scale-95 transition shadow-2xl">
            <span id="authBtnIcon">🔑</span>
            <span id="authBtnText" class="hidden sm:inline">تسجيل الدخول</span>
        </button>
        <button id="logoutBtn" onclick="submitLogout()" class="hidden glass-hud px-2.5 py-2 rounded-xl flex items-center gap-1 border border-red-500/40 text-xs font-bold text-red-400 hover:bg-red-500/20 active:scale-95 transition shadow-2xl">
            <span>🚪</span>
        </button>
    </div>

    <div class="absolute top-4 right-4 z-40">
        <button id="toggleSidebarBtn" onclick="toggleSidebar()" class="glass-hud p-2.5 rounded-xl border border-amber-500/40 text-amber-400 hover:bg-amber-500/20 active:scale-95 transition shadow-2xl flex items-center justify-center">
            <span id="toggleSidebarIcon" class="text-base">🏆</span>
        </button>
    </div>

    <div id="loginModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-md p-4">
        <div class="glass-hud p-6 rounded-3xl w-full max-w-sm border border-cyan-500/40 text-center shadow-2xl space-y-4">
            <div class="text-4xl">⚽</div>
            <h3 class="text-lg font-bold text-cyan-400">تسجيل الدخول إلى الميدان</h3>
            <p class="text-xs text-gray-300 leading-relaxed">أدخل بريدك الإلكتروني وكلمة السر المعتمدة:</p>
            
            <div class="space-y-3">
                <input type="email" id="userEmailInput" placeholder="البريد الإلكتروني" class="w-full px-4 py-3 bg-gray-900/90 border border-cyan-500/30 rounded-xl text-white text-xs text-right font-mono focus:outline-none focus:border-cyan-400 transition">
                <input type="password" id="userPasswordInput" placeholder="كلمة السر" class="w-full px-4 py-3 bg-gray-900/90 border border-cyan-500/30 rounded-xl text-white text-xs text-right font-mono focus:outline-none focus:border-cyan-400 transition">
            </div>

            <div id="loginError" class="hidden text-xs text-red-400 font-bold bg-red-950/50 p-2 rounded-lg border border-red-500/30"></div>
            
            <div class="flex gap-2">
                <button id="submitLoginBtn" onclick="submitLogin()" class="flex-1 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white py-2.5 rounded-xl text-xs font-bold transition shadow-lg active:scale-95 flex items-center justify-center gap-2">
                    <span id="loginBtnSpinner" class="hidden w-3 h-3 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                    <span id="loginBtnText">دخول</span>
                </button>
                <button onclick="closeLoginModal()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 py-2.5 rounded-xl text-xs font-bold transition active:scale-95">إلغاء</button>
            </div>
        </div>
    </div>

    <aside id="leaderboardSidebar" class="sidebar-transition absolute top-16 right-4 z-30 glass-hud p-4 rounded-2xl w-72 sm:w-80 border border-amber-500/30 shadow-2xl transform translate-x-0 opacity-100">
        <div class="flex items-center justify-between mb-3 pb-2 border-b border-white/10">
            <div class="flex items-center gap-2">
                <span class="text-xl">🏆</span>
                <h3 class="font-bold text-sm text-amber-400">المتصدرون (Top 5)</h3>
            </div>
            <button onclick="toggleSidebar()" class="text-xs text-gray-400 hover:text-white sm:hidden">✕ إخفاء</button>
        </div>
        <ul id="leaderboardList" class="space-y-2 text-xs"></ul>
    </aside>

    <canvas id="worldCanvas" class="w-full h-full block cursor-crosshair"></canvas>

<script>
    const SUPABASE_URL = "https://bwbgfdteocewitdzrysg.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3YmdmZHRlb2Nld2l0ZHpyeXNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NTE2MTMsImV4cCI6MjEwMzQyNzYxM30.C7hId5uF-p_7ibGSs0P7a2yxpOD-Zu4ON-lu7Pivn6k";

    let supabaseClient = null;
    let socket = null;

    try {
        if (typeof supabase !== 'undefined' && SUPABASE_URL && SUPABASE_ANON_KEY) {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
    } catch (e) {
        console.error("Supabase Init Error:", e);
    }

    // ⚡ دالة الرسالة الشفافة الومضة
    function showNotification(message, type = 'error') {
        const container = document.getElementById('toastContainer');
        if (!container) return;

        container.innerHTML = '';

        const toast = document.createElement('div');
        const bgColor = type === 'error' 
            ? 'bg-red-950/80 border-red-500/60 text-red-200 shadow-red-500/20' 
            : 'bg-emerald-950/80 border-emerald-500/60 text-emerald-200 shadow-emerald-500/20';
        const icon = type === 'error' ? '⚡' : '✨';

        toast.className = `flash-toast fixed left-1/2 glass-hud px-5 py-2.5 rounded-2xl border text-xs sm:text-sm font-black shadow-2xl flex items-center justify-center gap-2 ${bgColor} whitespace-nowrap`;
        toast.innerHTML = `<span class="text-base">${icon}</span> <span class="leading-none">${message}</span>`;
        
        container.appendChild(toast);

        setTimeout(() => {
            if (toast && toast.parentNode) {
                toast.remove();
            }
        }, 2000);
    }

    let sidebarOpen = true;
    function toggleSidebar() {
        const sidebar = document.getElementById('leaderboardSidebar');
        const icon = document.getElementById('toggleSidebarIcon');
        sidebarOpen = !sidebarOpen;
        
        if (sidebarOpen) {
            sidebar.classList.remove('translate-x-[120%]', 'opacity-0', 'pointer-events-none');
            sidebar.classList.add('translate-x-0', 'opacity-100');
            icon.innerText = '🏆';
        } else {
            sidebar.classList.remove('translate-x-0', 'opacity-100');
            sidebar.classList.add('translate-x-[120%]', 'opacity-0', 'pointer-events-none');
            icon.innerText = '📊';
        }
    }

    const canvas = document.getElementById('worldCanvas');
    const ctx = canvas.getContext('2d');

    let screenWidth, screenHeight;
    function resize() {
        const dpr = window.devicePixelRatio || 1;
        screenWidth = window.innerWidth;
        screenHeight = window.innerHeight;

        canvas.width = screenWidth * dpr;
        canvas.height = screenHeight * dpr;

        canvas.style.width = screenWidth + 'px';
        canvas.style.height = screenHeight + 'px';

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
    }
    window.addEventListener('resize', resize);
    resize();

    // 🏟️ أبعاد الساحة
    const PITCH_BOUNDS = { minX: 0, maxX: 14000, minY: 0, maxY: 8000 };
    const centerX = (PITCH_BOUNDS.maxX + PITCH_BOUNDS.minX) / 2;
    const centerY = (PITCH_BOUNDS.maxY + PITCH_BOUNDS.minY) / 2;

    let camera = { x: centerX, y: centerY, zoom: 0.15, targetZoom: 0.15 };
    const MIN_ZOOM = 0.05;
    const MAX_ZOOM = 2.50;

    let activePlayers = {};
    let standVault = {};
    let standLocations = {};
    let standTotals = {}; 
    let localTargetPos = { x: centerX, y: centerY };

    let currentUserProfile = null;
    let selectedCountryCode = 'SY'; 
    let currentUserId = localStorage.getItem('dominion_user_id') || `guest_${Math.floor(Math.random() * 89999 + 10000)}`;

    let eatEffects = [];

    function calculateRadius(points) {
        const val = Math.max(0, Number(points) || 0);
        const calculatedRadius = 60 + (Math.pow(val, 0.55) * 16);
        return Math.min(1200, Math.max(60, Math.round(calculatedRadius)));
    }

    const monumentImages = {};
    const countryLandmarks = {
        "SY": { name: "سوريا", flag: "🇸🇾", color: "#00f5ff", url: "https://images.unsplash.com/photo-1565557623262-b51c2513a641?auto=format&fit=crop&w=400&q=80" },
        "SA": { name: "السعودية", flag: "🇸🇦", color: "#3bff17", url: "https://images.unsplash.com/photo-1586724237569-f3d0c1dee8c6?auto=format&fit=crop&w=400&q=80" },
        "TR": { name: "تركيا", flag: "🇹🇷", color: "#ff4b89", url: "https://images.unsplash.com/photo-1541432901042-2d8bd64b4a9b?auto=format&fit=crop&w=400&q=80" },
        "EG": { name: "مصر", flag: "🇪🇬", color: "#ffb1c3", url: "https://images.unsplash.com/photo-1503177119275-0aa32b3a9368?auto=format&fit=crop&w=400&q=80" },
        "AE": { name: "الإمارات", flag: "🇦🇪", color: "#ffd9e0", url: "https://images.unsplash.com/photo-1512453979798-5ea266f8880c?auto=format&fit=crop&w=400&q=80" }
    };

    Object.keys(countryLandmarks).forEach(code => {
        const img = new Image();
        img.src = countryLandmarks[code].url;
        monumentImages[code] = img;
    });

    function confirmCountryAndStart() {
        const dropdown = document.getElementById('countrySelectDropdown');
        if (dropdown) selectedCountryCode = dropdown.value;
        document.getElementById('countrySelectModal').classList.add('hidden');

        setupWebSocket();
    }

    function setupWebSocket() {
        if (socket) socket.close();
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}?userId=${currentUserId}&country=${selectedCountryCode}`;
        
        try {
            socket = new WebSocket(wsUrl);
            socket.onopen = () => console.log("تم الاتصال بالسيرفر.");

            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'INIT') {
                        currentUserId = data.selfId;
                        if (data.standLocations) standLocations = data.standLocations;
                    } else if (data.type === 'SYNC') {
                        Object.keys(data.activePlayers || {}).forEach(id => {
                            const pData = data.activePlayers[id];
                            if (!activePlayers[id]) {
                                activePlayers[id] = { ...pData, targetX: pData.x, targetY: pData.y };
                            } else {
                                activePlayers[id].x = pData.x;
                                activePlayers[id].y = pData.y;
                                activePlayers[id].targetX = pData.targetX !== undefined ? pData.targetX : pData.x;
                                activePlayers[id].targetY = pData.targetY !== undefined ? pData.targetY : pData.y;
                                activePlayers[id].points = pData.points;
                                activePlayers[id].radius = calculateRadius(pData.points);
                                activePlayers[id].isProtected = pData.isProtected;
                                activePlayers[id].protectedUntil = pData.protectedUntil;
                            }
                        });

                        Object.keys(activePlayers).forEach(id => {
                            if (!data.activePlayers[id]) {
                                delete activePlayers[id];
                            }
                        });

                        standVault = data.standVault || {};
                        if (data.standLocations) standLocations = data.standLocations;
                        if (data.standTotals) standTotals = data.standTotals;

                        if (data.incentivePool !== undefined) {
                            const poolValEl = document.getElementById('incentivePoolVal');
                            if (poolValEl) poolValEl.innerText = Number(data.incentivePool || 0);
                        }

                        updateLeaderboard();
                    } else if (data.type === 'EATEN') {
                        document.getElementById('respawnOverlay').classList.remove('hidden');
                        showNotification(`تم ابتلاعك بواسطة ${data.eatenBy}`, 'error');
                    }
                } catch (e) {}
            };

            socket.onclose = () => setTimeout(setupWebSocket, 3000);
        } catch(e) {
            console.error("خطأ الاتصال بالسيرفر:", e);
        }
    }

    function requestReentry() {
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: 'REENTER_ARENA' }));
        }
        document.getElementById('respawnOverlay').classList.add('hidden');
    }

    function updatePhysics() {
        for (let i = eatEffects.length - 1; i >= 0; i--) {
            const fx = eatEffects[i];
            fx.radius += 4;
            fx.alpha -= 0.04;
            if (fx.alpha <= 0 || fx.radius >= fx.maxRadius) {
                eatEffects.splice(i, 1);
            }
        }
    }

    function updateAuthUI() {
        const authBtnText = document.getElementById('authBtnText');
        const authBtnIcon = document.getElementById('authBtnIcon');
        const logoutBtn = document.getElementById('logoutBtn');
        
        if (currentUserId && !currentUserId.startsWith('guest_')) {
            if (authBtnText) authBtnText.innerText = currentUserProfile?.display_name || currentUserProfile?.username || 'حسابي';
            if (authBtnIcon) authBtnIcon.innerText = '👤';
            if (logoutBtn) logoutBtn.classList.remove('hidden');
        } else {
            if (authBtnText) authBtnText.innerText = 'تسجيل الدخول';
            if (authBtnIcon) authBtnIcon.innerText = '🔑';
            if (logoutBtn) logoutBtn.classList.add('hidden');
        }
    }

    async function fetchUserProfile(uid) {
        if (!supabaseClient || !uid || uid.startsWith('guest_')) return;
        try {
            const { data, error } = await supabaseClient.from('profiles').select('*').eq('id', uid).maybeSingle();
            if (!error && data) {
                currentUserProfile = data;
                updateAuthUI();
            }
        } catch (e) {}
    }

    function openLoginModal() { document.getElementById('loginModal').classList.remove('hidden'); }
    function closeLoginModal() { document.getElementById('loginModal').classList.add('hidden'); }

    async function submitLogin() {
        const email = document.getElementById('userEmailInput').value.trim();
        const password = document.getElementById('userPasswordInput').value.trim();
        const errorEl = document.getElementById('loginError');

        if (!email || !password) return;

        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (!error && data?.user) {
                delete activePlayers[currentUserId];
                currentUserId = data.user.id;
                localStorage.setItem('dominion_user_id', currentUserId);
                await fetchUserProfile(currentUserId);
                showNotification("تم تسجيل الدخول بنجاح!", "success");
                closeLoginModal();
                setupWebSocket();
            } else {
                errorEl.innerText = "البيانات المدخلة غير صحيحة";
                errorEl.classList.remove('hidden');
            }
        } catch (err) {}
    }

    async function submitLogout() {
        if (supabaseClient) await supabaseClient.auth.signOut();
        delete activePlayers[currentUserId];
        localStorage.removeItem('dominion_user_id');
        currentUserId = `guest_${Math.floor(Math.random() * 89999 + 10000)}`;
        currentUserProfile = null;
        updateAuthUI();
        setupWebSocket();
    }

    window.addEventListener('wheel', (e) => {
        if (e.target.closest('#toastContainer, #leaderboardSidebar, #loginModal, #countrySelectModal, #respawnOverlay')) return;
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
        camera.targetZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, camera.targetZoom * zoomFactor));
    }, { passive: false });

    let touchStartDist = 0;
    window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
            touchStartDist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
        } else if (e.touches.length === 1) {
            const touch = e.touches[0];
            if (!touch.target.closest('header, aside, button, #loginModal, #toastContainer, #respawnOverlay, #countrySelectModal')) {
                sendTarget(touch.clientX, touch.clientY);
            }
        }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
            const currentDist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            if (touchStartDist > 0) {
                const scale = currentDist / touchStartDist;
                camera.targetZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, camera.targetZoom * (scale > 1 ? 1.03 : 0.97)));
                touchStartDist = currentDist;
            }
        } else if (e.touches.length === 1) {
            const touch = e.touches[0];
            if (touch.target.closest('header, aside, button, #loginModal, #toastContainer, #respawnOverlay, #countrySelectModal')) return;
            e.preventDefault();
            sendTarget(touch.clientX, touch.clientY);
        }
    }, { passive: false });

    function sendTarget(clientX, clientY) {
        const me = activePlayers[currentUserId];
        if (!me) return;

        const worldX = me.x + (clientX - screenWidth / 2) / camera.zoom;
        const worldY = me.y + (clientY - screenHeight / 2) / camera.zoom;

        const targetX = Math.max(PITCH_BOUNDS.minX, Math.min(PITCH_BOUNDS.maxX, worldX));
        const targetY = Math.max(PITCH_BOUNDS.minY, Math.min(PITCH_BOUNDS.maxY, worldY));

        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({
                type: 'TARGET',
                x: targetX,
                y: targetY
            }));
        }
    }

    window.addEventListener('mousemove', (e) => {
        if (e.target.closest('header, aside, button, #loginModal, #toastContainer, #respawnOverlay, #countrySelectModal')) return;
        sendTarget(e.clientX, e.clientY);
    });

    function updateLeaderboard() {
        const listEl = document.getElementById('leaderboardList');
        if (!listEl) return;
        
        let allEntities = [...Object.values(activePlayers), ...Object.values(standVault)];
        allEntities.sort((a, b) => (Number(b.points) || 0) - (Number(a.points) || 0));
        const top5 = allEntities.slice(0, 5);

        listEl.innerHTML = top5.map((item, index) => {
            const isMe = item.id === currentUserId;
            const flag = item.country?.flag || '🚩';
            const name = item.name || 'لاعب';
            const points = Number(item.points || 0).toLocaleString();

            return `
                <li class="flex items-center justify-between p-2 rounded-lg ${isMe ? 'bg-amber-500/20 border border-amber-500/50' : 'bg-white/5'}">
                    <div class="flex items-center gap-2 truncate">
                        <span class="font-bold text-amber-400 w-4">${index + 1}.</span>
                        <span class="truncate font-bold">${flag} ${name}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-mono font-bold text-cyan-300">${points} $</span>
                    </div>
                </li>
            `;
        }).join('');
    }

    function drawStands() {
        if (!standLocations) return;

        Object.keys(standLocations).forEach(code => {
            const stand = standLocations[code];
            const w = stand.width || 2500;
            const h = stand.height || 400;
            const x = stand.x - w / 2;
            const y = stand.y - h / 2;

            const landmark = countryLandmarks[code];
            const img = monumentImages[code];
            const themeColor = landmark?.color || "#00f5ff";
            const totalBalance = Number(standTotals[code] || 0).toLocaleString();

            ctx.save();
            if (img && img.complete && img.naturalWidth !== 0) {
                ctx.globalAlpha = 0.35;
                ctx.drawImage(img, x, y, w, h);
                ctx.globalAlpha = 1.0;
            } else {
                ctx.fillStyle = "rgba(15, 23, 42, 0.8)";
                ctx.fillRect(x, y, w, h);
            }

            ctx.strokeStyle = themeColor;
            ctx.lineWidth = 12;
            ctx.shadowBlur = 25;
            ctx.shadowColor = themeColor;
            ctx.strokeRect(x, y, w, h);
            ctx.shadowBlur = 0;

            ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
            ctx.fillRect(x, y, w, h);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 80px 'Tajawal'";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(`${landmark?.flag || ''} مدرج ${landmark?.name || code}`, stand.x, stand.y - 30);

            ctx.font = "bold 65px 'Sora'";
            ctx.fillStyle = "#00ffff";
            ctx.fillText(`إجمالي: ${totalBalance} $`, stand.x, stand.y + 55);

            ctx.restore();
        });
    }

    function drawStadiumPitch() {
        ctx.fillStyle = "#0c1220";
        ctx.fillRect(-6000, -6000, 26000, 20000);

        let lightGrad = ctx.createRadialGradient(centerX, centerY, 1000, centerX, centerY, 12000);
        lightGrad.addColorStop(0, "rgba(0, 245, 255, 0.12)");
        lightGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = lightGrad;
        ctx.fillRect(-6000, -6000, 26000, 20000);

        let pitchWidth = PITCH_BOUNDS.maxX - PITCH_BOUNDS.minX;
        let pitchHeight = PITCH_BOUNDS.maxY - PITCH_BOUNDS.minY;

        let turfGrad = ctx.createLinearGradient(0, PITCH_BOUNDS.minY, 0, PITCH_BOUNDS.maxY);
        turfGrad.addColorStop(0, "#0a3320");
        turfGrad.addColorStop(0.5, "#0e442b");
        turfGrad.addColorStop(1, "#0a3320");
        ctx.fillStyle = turfGrad;
        ctx.fillRect(PITCH_BOUNDS.minX, PITCH_BOUNDS.minY, pitchWidth, pitchHeight);

        ctx.fillStyle = "rgba(255, 255, 255, 0.03)";
        for (let x = PITCH_BOUNDS.minX; x < PITCH_BOUNDS.maxX; x += 700) {
            ctx.fillRect(x, PITCH_BOUNDS.minY, 350, pitchHeight);
        }

        ctx.strokeStyle = "#00f5ff";
        ctx.lineWidth = 25;
        ctx.shadowBlur = 50;
        ctx.shadowColor = "#00f5ff";
        ctx.strokeRect(PITCH_BOUNDS.minX, PITCH_BOUNDS.minY, pitchWidth, pitchHeight);
        ctx.shadowBlur = 0;

        ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
        ctx.lineWidth = 18;
        ctx.beginPath(); ctx.moveTo(centerX, PITCH_BOUNDS.minY); ctx.lineTo(centerX, PITCH_BOUNDS.maxY); ctx.stroke();
        ctx.beginPath(); ctx.arc(centerX, centerY, 1000, 0, Math.PI * 2); ctx.stroke();
    }

    function drawEatEffects() {
        eatEffects.forEach(fx => {
            ctx.save();
            ctx.beginPath();
            ctx.arc(fx.x, fx.y, fx.radius, 0, Math.PI * 2);
            ctx.strokeStyle = fx.color;
            ctx.lineWidth = 6;
            ctx.globalAlpha = fx.alpha;
            ctx.shadowBlur = 15;
            ctx.shadowColor = fx.color;
            ctx.stroke();
            ctx.restore();
        });
    }

    function drawOrb(p) {
        if (!p || typeof p.x !== 'number' || typeof p.y !== 'number') return;
        
        ctx.save();
        ctx.translate(p.x, p.y);

        const radius = p.radius || calculateRadius(p.points);
        const countryCode = p.country?.code || "SY";
        const img = monumentImages[countryCode];
        const themeColor = countryLandmarks[countryCode]?.color || "#00f5ff";
        const isProtected = p.protectedUntil && (p.protectedUntil > Date.now());

        if (isProtected) {
            ctx.beginPath();
            ctx.arc(0, 0, radius + 14, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(255, 215, 0, 0.9)";
            ctx.lineWidth = 8;
            ctx.shadowBlur = 20;
            ctx.shadowColor = "#ffd700";
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.clip();

        if (img && img.complete && img.naturalWidth !== 0) {
            ctx.drawImage(img, -radius, -radius, radius * 2, radius * 2);
        }

        let glassGrad = ctx.createRadialGradient(-radius * 0.3, -radius * 0.3, 2, 0, 0, radius);
        glassGrad.addColorStop(0, "rgba(255, 255, 255, 0.3)");
        glassGrad.addColorStop(1, "rgba(0, 0, 0, 0.7)");
        ctx.fillStyle = glassGrad;
        ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();

        ctx.lineWidth = Math.max(4, radius * 0.05);
        ctx.strokeStyle = (p.id === currentUserId) ? "#ffd700" : themeColor;
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        
        const fontSize = Math.max(14, radius * 0.3);
        ctx.font = `bold ${fontSize}px 'Tajawal'`;
        
        const flag = p.country?.flag || '';
        const name = p.name || 'لاعب';
        const displayBalance = Number(p.points || 0).toLocaleString();

        ctx.fillText(`${flag} ${name}`, 0, -fontSize * 0.7);
        ctx.font = `bold ${fontSize * 0.85}px 'Sora'`;
        ctx.fillStyle = "#00ffff";
        ctx.fillText(`${displayBalance} $`, 0, fontSize * 0.7);

        ctx.restore();
    }

    function render() {
        updatePhysics();

        const dpr = window.devicePixelRatio || 1;
        const me = activePlayers[currentUserId] || standVault[currentUserId];
        
        if (me) {
            camera.x += (me.x - camera.x) * 0.1;
            camera.y += (me.y - camera.y) * 0.1;
        }

        camera.zoom += (camera.targetZoom - camera.zoom) * 0.1;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        
        ctx.scale(dpr, dpr);
        ctx.translate(screenWidth / 2, screenHeight / 2);
        ctx.scale(camera.zoom, camera.zoom);
        ctx.translate(-camera.x, -camera.y);

        drawStadiumPitch();
        drawStands();
        drawEatEffects();

        Object.values(standVault).forEach(p => drawOrb(p));
        Object.values(activePlayers).forEach(p => drawOrb(p));

        ctx.restore();
        requestAnimationFrame(render);
    }

    if (!currentUserId.startsWith('guest_')) fetchUserProfile(currentUserId);
    updateAuthUI();
    render();
</script>
</body>
</html>
