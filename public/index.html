<!DOCTYPE html>
<html class="dark" lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Dominion Arena Stadium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0c101c; margin: 0; overflow: hidden; touch-action: none; }
        .glass-hud { background: rgba(10, 14, 23, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.12); }
    </style>
</head>
<body class="text-white relative w-screen h-screen select-none">

    <!-- HUD Header -->
    <header class="absolute top-6 left-1/2 -translate-x-1/2 z-30 flex items-center gap-6 glass-hud px-8 py-3 rounded-2xl shadow-2xl border border-cyan-500/30">
        <div class="flex items-center gap-3">
            <span class="text-3xl">⚔️</span>
            <div>
                <div id="hudStatusTitle" class="text-[10px] uppercase text-cyan-400 font-bold tracking-widest">كاميرا تكتيكية ديناميكية</div>
                <div id="hudActionTip" class="text-xs font-bold text-emerald-400">انقر بزر الماوس أو اللمس للنزول إلى الميدان والتوجيه</div>
            </div>
        </div>
    </header>

    <!-- Leaderboard -->
    <aside class="absolute top-6 right-6 z-30 glass-hud p-4 rounded-2xl w-72 border border-amber-500/30 shadow-2xl">
        <div class="flex items-center gap-2 mb-3 pb-2 border-b border-white/10">
            <span class="text-xl">🏆</span>
            <h3 class="font-bold text-sm text-amber-400">قائمة المتصدرين (Top 5)</h3>
        </div>
        <ul id="leaderboardList" class="space-y-2 text-xs"></ul>
    </aside>

    <canvas id="worldCanvas" class="w-full h-full block cursor-crosshair"></canvas>

<script>
    const canvas = document.getElementById('worldCanvas');
    const ctx = canvas.getContext('2d');

    let screenWidth, screenHeight;
    function resize() {
        screenWidth = canvas.width = window.innerWidth;
        screenHeight = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 🏟️ أبعاد حدود الملعب المعتمدة والمطابقة للسيرفر
    const PITCH_BOUNDS = { minX: 1800, maxX: 6200, minY: 1800, maxY: 6200 };

    // الكاميرا الديناميكية
    let camera = { x: 4000, y: 4000, zoom: 0.25, targetZoom: 0.25 };
    const MIN_ZOOM = 0.10;
    const MAX_ZOOM = 1.20;

    let activePlayers = {};
    let standVault = {};
    let dynamicStands = {};
    let selfId = null;

    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const socket = new WebSocket(`${protocol}//${window.location.host}`);

    socket.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);
            if (data.type === 'INIT') {
                selfId = data.selfId;
            } else if (data.type === 'SYNC') {
                activePlayers = data.activePlayers || {};
                standVault = data.standVault || {};
                dynamicStands = data.dynamicStands || {};
                
                const myOrb = activePlayers[selfId] || standVault[selfId];
                if (myOrb) {
                    camera.x += (myOrb.x - camera.x) * 0.1;
                    camera.y += (myOrb.y - camera.y) * 0.1;
                }
                updateLeaderboard();
            }
        } catch(e) {
            console.error("خطأ في استقبال البيانات:", e);
        }
    };

    // 🔍 تحكّم الكاميرا بعجلة الماوس
    window.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
        camera.targetZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, camera.targetZoom * zoomFactor));
    }, { passive: false });

    function getWorldCoordinates(clientX, clientY) {
        const worldX = (clientX - screenWidth / 2) / camera.zoom + camera.x;
        const worldY = (clientY - screenHeight / 2) / camera.zoom + camera.y;
        return { x: worldX, y: worldY };
    }

    function clampToPitch(x, y, radius = 40) {
        const clampedX = Math.max(PITCH_BOUNDS.minX + radius, Math.min(PITCH_BOUNDS.maxX - radius, x));
        const clampedY = Math.max(PITCH_BOUNDS.minY + radius, Math.min(PITCH_BOUNDS.maxY - radius, y));
        return { x: clampedX, y: clampedY };
    }

    function handleActionPointer(clientX, clientY) {
        if (!selfId) return;

        const myOrb = activePlayers[selfId] || standVault[selfId];
        if (!myOrb) return;

        const rawPos = getWorldCoordinates(clientX, clientY);
        const playerRadius = myOrb.radius || 40;
        const boundedPos = clampToPitch(rawPos.x, rawPos.y, playerRadius);

        if (myOrb.inStand) {
            socket.send(JSON.stringify({
                type: 'ENTER_ARENA',
                targetX: boundedPos.x,
                targetY: boundedPos.y
            }));
        } else {
            socket.send(JSON.stringify({
                type: 'TARGET',
                x: boundedPos.x,
                y: boundedPos.y
            }));
        }
    }

    window.addEventListener('mousedown', (e) => handleActionPointer(e.clientX, e.clientY));
    window.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches.length > 0) handleActionPointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    window.addEventListener('mousemove', (e) => {
        if (!selfId || !activePlayers[selfId]) return;
        const myOrb = activePlayers[selfId];
        const rawPos = getWorldCoordinates(e.clientX, e.clientY);
        const boundedPos = clampToPitch(rawPos.x, rawPos.y, myOrb.radius || 40);
        socket.send(JSON.stringify({ type: 'TARGET', x: boundedPos.x, y: boundedPos.y }));
    });

    function updateLeaderboard() {
        const listEl = document.getElementById('leaderboardList');
        if (!listEl) return;

        const allEntities = [...Object.values(activePlayers), ...Object.values(standVault)];
        allEntities.sort((a, b) => (b.points || 0) - (a.points || 0));
        const top5 = allEntities.slice(0, 5);

        listEl.innerHTML = top5.map((item, index) => {
            const isMe = item.id === selfId;
            const flag = item.country?.flag || '🌐';
            const name = item.name || 'لاعب';
            const pts = (item.points || 0).toLocaleString();
            const statusTag = item.inStand ? '<span class="text-[9px] text-gray-400 bg-gray-800 px-1.5 py-0.5 rounded">مدرج</span>' : '<span class="text-[9px] text-emerald-400 bg-emerald-950 px-1.5 py-0.5 rounded">ملعب</span>';
            
            return `
                <li class="flex items-center justify-between p-2 rounded-lg ${isMe ? 'bg-amber-500/20 border border-amber-500/50' : 'bg-white/5'}">
                    <div class="flex items-center gap-2 truncate">
                        <span class="font-bold text-amber-400 w-4">${index + 1}.</span>
                        <span class="truncate">${flag} ${name}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        ${statusTag}
                        <span class="font-mono font-bold text-cyan-300">${pts}</span>
                    </div>
                </li>
            `;
        }).join('');
    }

    // 🎨 رسم أرضية الملعب
    function drawStadiumPitch() {
        ctx.fillStyle = "#0c1220";
        ctx.fillRect(-5000, -5000, 18000, 18000);

        let turfGrad = ctx.createLinearGradient(0, PITCH_BOUNDS.minY, 0, PITCH_BOUNDS.maxY);
        turfGrad.addColorStop(0, "#0a3320");
        turfGrad.addColorStop(0.5, "#0e442b");
        turfGrad.addColorStop(1, "#0a3320");
        ctx.fillStyle = turfGrad;
        ctx.fillRect(PITCH_BOUNDS.minX, PITCH_BOUNDS.minY, PITCH_BOUNDS.maxX - PITCH_BOUNDS.minX, PITCH_BOUNDS.maxY - PITCH_BOUNDS.minY);

        ctx.strokeStyle = "#00f5ff";
        ctx.lineWidth = 14;
        ctx.shadowBlur = 25;
        ctx.shadowColor = "#00f5ff";
        ctx.strokeRect(PITCH_BOUNDS.minX, PITCH_BOUNDS.minY, PITCH_BOUNDS.maxX - PITCH_BOUNDS.minX, PITCH_BOUNDS.maxY - PITCH_BOUNDS.minY);
        ctx.shadowBlur = 0;

        const centerX = (PITCH_BOUNDS.minX + PITCH_BOUNDS.maxX) / 2;
        const centerY = (PITCH_BOUNDS.minY + PITCH_BOUNDS.maxY) / 2;

        ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
        ctx.lineWidth = 10;
        ctx.beginPath(); ctx.moveTo(centerX, PITCH_BOUNDS.minY); ctx.lineTo(centerX, PITCH_BOUNDS.maxY); ctx.stroke();
        ctx.beginPath(); ctx.arc(centerX, centerY, 450, 0, Math.PI * 2); ctx.stroke();
    }

    // 🏛️ رسم هيكلية مدرجات الدول الديناميكية المرسلة من السيرفر
    function drawDynamicStands() {
        Object.values(dynamicStands).forEach(stand => {
            ctx.save();
            ctx.fillStyle = "#111827";
            ctx.strokeStyle = stand.color || "#00f5ff";
            ctx.lineWidth = 4;
            ctx.shadowBlur = 15;
            ctx.shadowColor = ctx.strokeStyle;

            ctx.beginPath();
            ctx.roundRect(stand.x - 500, stand.y - 400, 1000, 800, 20);
            ctx.fill();
            ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 36px 'Tajawal'";
            ctx.textAlign = "center";
            ctx.fillText(`${stand.flag} مدرج ${stand.name}`, stand.x, stand.y - 320);
            ctx.restore();
        });
    }

    // 🔮 رسم الكرة (سواء في المدرج أو في الملعب)
    function drawOrb(p, isStand) {
        if (!p || p.x === undefined || p.y === undefined) return;

        ctx.save();
        ctx.translate(p.x, p.y);

        const radius = p.radius || 35;
        const flag = p.country?.flag || '🌐';
        const color = p.country?.color || '#00f5ff';

        // جسم الكرة
        let glassGrad = ctx.createRadialGradient(-radius * 0.3, -radius * 0.3, 2, 0, 0, radius);
        glassGrad.addColorStop(0, "rgba(255, 255, 255, 0.6)");
        glassGrad.addColorStop(1, color);
        
        ctx.fillStyle = glassGrad;
        ctx.beginPath(); 
        ctx.arc(0, 0, radius, 0, Math.PI * 2); 
        ctx.fill();

        ctx.lineWidth = Math.max(3, radius * 0.08);
        ctx.strokeStyle = isStand ? "rgba(255, 255, 255, 0.4)" : (p.id === selfId ? "#ffd700" : "#ffffff");
        ctx.shadowBlur = isStand ? 5 : (p.id === selfId ? 25 : 12);
        ctx.shadowColor = ctx.strokeStyle;
        ctx.stroke();

        // النص والبيانات فوق الكرة
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        
        const fontSize = Math.max(11, radius * 0.25);
        ctx.font = `bold ${fontSize}px 'Tajawal'`;
        ctx.fillText(`${flag} ${p.name || ''}`, 0, -fontSize * 0.4);

        ctx.font = `bold ${fontSize * 0.75}px 'Sora'`;
        ctx.fillStyle = isStand ? "#cbd5e0" : "#00ffff";
        ctx.fillText(`${(p.points || 0).toLocaleString()} PTS`, 0, fontSize * 0.65);

        ctx.restore();
    }

    function render() {
        camera.zoom += (camera.targetZoom - camera.zoom) * 0.1;

        ctx.clearRect(0, 0, screenWidth, screenHeight);
        ctx.save();
        ctx.translate(screenWidth / 2, screenHeight / 2);
        ctx.scale(camera.zoom, camera.zoom);
        ctx.translate(-camera.x, -camera.y);

        drawStadiumPitch();
        drawDynamicStands();

        // 🔴 رسم جميع كرات الحسابات الموجودة بالمدرجات
        Object.values(standVault).forEach(p => drawOrb(p, true));
        
        // 🟢 رسم الكرات النشطة داخل الملعب
        Object.values(activePlayers).forEach(p => drawOrb(p, false));

        ctx.restore();
        requestAnimationFrame(render);
    }

    render();
</script>
</body>
</html>
