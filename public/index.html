<!DOCTYPE html>
<html class="dark" lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dominion Sanctuary & Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #050608; margin: 0; overflow: hidden; }
        .glass-hud { background: rgba(15, 17, 23, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="text-white relative w-screen h-screen select-none">

    <header class="absolute top-6 left-1/2 -translate-x-1/2 z-30 flex items-center gap-6 glass-hud px-8 py-3 rounded-2xl shadow-2xl border border-cyan-500/30">
        <div class="flex items-center gap-3">
            <span class="text-3xl animate-bounce">🏰</span>
            <div>
                <div class="text-[10px] uppercase text-cyan-400 font-bold tracking-widest">المسرح الملكي وحلبة الصراع</div>
                <div class="text-sm font-black text-emerald-400">الكرات العلوية محشورة بأمان تهمة 100%</div>
            </div>
        </div>
    </header>

    <canvas id="worldCanvas" class="w-full h-full block cursor-crosshair"></canvas>

<script>
    const canvas = document.getElementById('worldCanvas');
    const ctx = canvas.getContext('2d');
    const WORLD_SIZE = { width: 7000, height: 6000 };

    let screenWidth, screenHeight;
    function resize() {
        screenWidth = canvas.width = window.innerWidth;
        screenHeight = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let camera = { x: 3500, y: 2500, zoom: 0.6 };
    let activePlayers = {};
    let safeVault = {};
    let selfId = null;

    const monumentImages = {};
    const countryLandmarks = {
        "SY": { name: "سوريا", vaultX: 1000, color: "#00f5ff", url: "https://images.unsplash.com/photo-1565557623262-b51c2513a641?auto=format&fit=crop&w=400&q=80" },
        "SA": { name: "السعودية", vaultX: 2200, color: "#3bff17", url: "https://images.unsplash.com/photo-1586724237569-f3d0c1dee8c6?auto=format&fit=crop&w=400&q=80" },
        "TR": { name: "تركيا", vaultX: 3400, color: "#ff4b89", url: "https://images.unsplash.com/photo-1541432901042-2d8bd64b4a9b?auto=format&fit=crop&w=400&q=80" },
        "EG": { name: "مصر", vaultX: 4600, color: "#ffb1c3", url: "https://images.unsplash.com/photo-1503177119275-0aa32b3a9368?auto=format&fit=crop&w=400&q=80" },
        "AE": { name: "الإمارات", vaultX: 5800, color: "#ffd9e0", url: "https://images.unsplash.com/photo-1512453979798-5ea266f8880c?auto=format&fit=crop&w=400&q=80" }
    };

    Object.keys(countryLandmarks).forEach(code => {
        const img = new Image();
        img.src = countryLandmarks[code].url;
        monumentImages[code] = img;
    });

    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}`;
    const socket = new WebSocket(wsUrl);

    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'INIT') {
            selfId = data.selfId;
        } else if (data.type === 'SYNC') {
            activePlayers = data.activePlayers;
            safeVault = data.safeVault;
            if (selfId && activePlayers[selfId]) {
                const me = activePlayers[selfId];
                camera.x += (me.x - camera.x) * 0.1;
                camera.y += (me.y - camera.y) * 0.1;
            }
        }
    };

    window.addEventListener('mousemove', (e) => {
        if (!selfId || !activePlayers[selfId]) return;
        const worldX = (e.clientX - screenWidth / 2) / camera.zoom + camera.x;
        const worldY = (e.clientY - screenHeight / 2) / camera.zoom + camera.y;
        socket.send(JSON.stringify({ type: 'TARGET', x: worldX, y: worldY }));
    });

    function drawOrb(p, isSafe) {
        ctx.save();
        ctx.translate(p.x, p.y);

        const countryCode = p.country?.code || "SY";
        const img = monumentImages[countryCode];
        const themeColor = countryLandmarks[countryCode]?.color || "#00f5ff";

        ctx.beginPath();
        ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
        ctx.clip();

        if (img && img.complete) {
            const scale = Math.max(1, p.radius / 30);
            const drawWidth = p.radius * 2 * scale;
            const drawHeight = p.radius * 2 * scale;
            ctx.globalAlpha = isSafe ? 0.5 : 0.85;
            ctx.drawImage(img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
            ctx.globalAlpha = 1.0;
        }

        let glassGrad = ctx.createRadialGradient(-p.radius * 0.3, -p.radius * 0.3, 2, 0, 0, p.radius);
        glassGrad.addColorStop(0, "rgba(255, 255, 255, 0.45)");
        glassGrad.addColorStop(1, "rgba(0, 0, 0, 0.7)");
        ctx.fillStyle = glassGrad;
        ctx.beginPath(); ctx.arc(0, 0, p.radius, 0, Math.PI * 2); ctx.fill();

        ctx.lineWidth = Math.max(3, p.radius * 0.08);
        ctx.strokeStyle = isSafe ? "#a0aec0" : (p.id === selfId ? "#ffd700" : themeColor);
        ctx.shadowBlur = isSafe ? 5 : 20;
        ctx.shadowColor = ctx.strokeStyle;
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const fontSize = Math.max(12, p.radius * 0.24);
        ctx.font = `bold ${fontSize}px 'Tajawal'`;
        ctx.fillText(`${p.country.flag} ${p.name}`, 0, -fontSize * 0.4);

        ctx.font = `bold ${fontSize * 0.75}px 'Sora'`;
        ctx.fillStyle = isSafe ? "#cbd5e0" : "#00ffff";
        ctx.fillText(`${p.points.toLocaleString()} PTS`, 0, fontSize * 0.65);

        ctx.restore();
    }

    function render() {
        ctx.clearRect(0, 0, screenWidth, screenHeight);
        ctx.save();
        ctx.translate(screenWidth / 2, screenHeight / 2);
        ctx.scale(camera.zoom, camera.zoom);
        ctx.translate(-camera.x, -camera.y);

        // 1. رسم قسم المسرح العلوي المحمي (Sanctuary Stage)
        ctx.fillStyle = "rgba(15, 23, 42, 0.6)";
        ctx.fillRect(200, 200, 6600, 1400);

        Object.keys(countryLandmarks).forEach(code => {
            const c = countryLandmarks[code];
            ctx.strokeStyle = c.color;
            ctx.lineWidth = 4;
            ctx.strokeRect(c.vaultX - 500, 300, 1000, 1200);

            ctx.fillStyle = c.color;
            ctx.font = "bold 28px 'Tajawal'";
            ctx.textAlign = "center";
            ctx.fillText(`🏰 قبة ${c.name} المحمية`, c.vaultX, 380);
        });

        // 2. الفاصل الناري بين المسرح والحلبة
        ctx.strokeStyle = "#ef4444";
        ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(200, 1800); ctx.lineTo(6800, 1800); ctx.stroke();
        ctx.fillStyle = "#ef4444";
        ctx.font = "bold 22px 'Tajawal'";
        ctx.fillText("⚠️ حلبة الصراع المباشرة (الكرات النشطة فقط) ⚠️", 3500, 1860);

        // 3. رسم الكرات الآمنة في المسرح
        Object.values(safeVault).forEach(p => drawOrb(p, true));

        // 4. رسم الكرات النشطة في الحلبة
        Object.values(activePlayers).forEach(p => drawOrb(p, false));

        ctx.restore();
        requestAnimationFrame(render);
    }

    render();
</script>
</body>
</html>
